name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: framediff-revision
        run: echo "sha=$(git rev-parse HEAD:vendor/framediff)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: micromanager3000/framediff
          ref: ${{ steps.framediff-revision.outputs.sha }}
          path: vendor/framediff
          ssh-key: ${{ secrets.FRAMEDIFF_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:authoring
      - run: npm run test --if-present
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: framediff-revision
        run: echo "sha=$(git rev-parse HEAD:vendor/framediff)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: micromanager3000/framediff
          ref: ${{ steps.framediff-revision.outputs.sha }}
          path: vendor/framediff
          ssh-key: ${{ secrets.FRAMEDIFF_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}
